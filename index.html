<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalVision Player v1.9.3</title>
  <link rel="preload" as="image" href="./waiting-left.jpg?v=1.9.3">
  <link rel="preload" as="image" href="./waiting-right.jpg?v=1.9.3">
  <link rel="stylesheet" href="./style.css?v=1.9.3" />
</head>
<body>
  <main id="screen">
    <section class="zone left-zone" id="leftZone">
      <img class="media contain lv-video-waiting" src="./waiting-left.jpg?v=1.9.3" alt="LocalVision">
    </section>

    <section class="zone right-zone" id="rightZone">
      <img class="media contain lv-video-waiting" src="./waiting-right.jpg?v=1.9.3" alt="LocalVision">
    </section>

    <div id="statusPill">LocalVision Player v1.9.3 시작중...</div>

    <aside id="debugPanel" hidden>
      <div class="debug-head">
        <h2>LocalVision Player</h2>
        <span>Player v1.9.3</span>
      </div>

      <dl>
        <dt>Store</dt><dd id="dbgStore">-</dd>
        <dt>Device ID</dt><dd id="dbgDevice">-</dd>
        <dt>API</dt><dd id="dbgApi">-</dd>
        <dt>Left</dt><dd id="dbgLeft">0</dd>
        <dt>Right</dt><dd id="dbgRight">0</dd>
        <dt>Sync</dt><dd id="dbgSync">-</dd>
        <dt>Heartbeat</dt><dd id="dbgHeartbeat">-</dd>
        <dt>Bundle</dt><dd id="dbgBundle">-</dd>
        <dt>Cache</dt><dd id="dbgCache">-</dd>
        <dt>Status</dt><dd id="dbgStatus">-</dd>
      </dl>

      <div class="debug-actions">
        <button id="syncBtn">Sync Now</button>
        <button id="clearCacheBtn">Clear Cache</button>
        <button id="reloadBtn">Reload</button>
      </div>
    </aside>
  </main>

  <script src="./integrity.js?v=1.9.3"></script>
  <script src="./playlist-store.js?v=1.9.3"></script>
  <script src="./runtime.js?v=1.9.3"></script>
  <script src="./app.js?v=1.9.3"></script>
</body>
</html>
